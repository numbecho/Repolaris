name: Build & Package Artifacts (CI/CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Signal Engine Tests (Python 3.14)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

  briefcase-release:
    name: Briefcase Distribution Release (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Linux Build Tools & Align System Python
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libgtk-3-dev appstream dpkg-dev debhelper
          # Align /usr/bin/python3 with the active Python 3.14 to satisfy Briefcase system version check
          ACTIVE_PYTHON="$(which python3)"
          sudo ln -sf "$ACTIVE_PYTHON" /usr/bin/python3
          sudo ln -sf "${ACTIVE_PYTHON}-config" /usr/bin/python3-config 2>/dev/null || true

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Briefcase Create & Build
        run: |
          briefcase create --no-input
          briefcase build --no-input

      - name: Prepare Windows WiX License
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "
          with open('LICENSE', 'r') as f: lines = f.readlines()
          rtf = ['{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Arial;}}\\f0\\fs20\n'] + [l.rstrip().replace('\\', '\\\\') + '\\par\n' for l in lines] + ['}\n']
          with open('LICENSE.rtf', 'w') as f: f.writelines(rtf)
          "
          Get-ChildItem -Path "build" -Recurse -Directory -Filter "app" | ForEach-Object {
            Copy-Item "LICENSE.rtf" -Destination $_.FullName -Force
          }

      - name: Briefcase Package (Installer Generation)
        run: |
          briefcase package --no-input --adhoc-sign

      - name: Upload Distribution Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repolaris-distribution-${{ runner.os }}
          path: |
            dist/*
          if-no-files-found: warn
          retention-days: 30
