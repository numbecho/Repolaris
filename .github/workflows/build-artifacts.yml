name: Build & Package Artifacts (CI/CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Signal Engine Tests (pip + unittest)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

  uv-ruff-test:
    name: Python 3.14, Astral uv & Ruff Suite
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Install uv and Set up Python 3.14
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync Environment with uv
        run: uv sync --all-extras --dev

      - name: Lint with Ruff (py314)
        run: uv run ruff check src tests

      - name: Run Test Suite via uv
        run: |
          uv run pytest -v
          uv run python -m unittest discover tests -v

  briefcase-release:
    name: Briefcase Distribution Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, uv-ruff-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Linux Build Tools & Align System Python
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-dev libgl1 libegl1 libxkbcommon-x11-0 libgtk-3-dev appstream dpkg-dev debhelper fakeroot patchelf
          PY_VER="$(python3 -c 'import sys; print(f"{sys.version_info.major}.{sys.version_info.minor}")')"
          PY_PREFIX="$(python3 -c 'import sys; print(sys.prefix)')"
          PY_INC="$(python3 -c 'import sysconfig; print(sysconfig.get_path("include"))')"
          ACTIVE_PYTHON="$(which python3)"
          ACTIVE_CONFIG="$(which python3-config)"
          sudo ln -sf "$ACTIVE_PYTHON" /usr/bin/python3
          sudo ln -sf "$ACTIVE_PYTHON" "/usr/bin/python${PY_VER}"
          printf '#!/bin/sh\nexec "%s" "$@"\n' "$ACTIVE_CONFIG" | sudo tee /usr/bin/python3-config "/usr/bin/python${PY_VER}-config" >/dev/null
          sudo chmod +x /usr/bin/python3-config "/usr/bin/python${PY_VER}-config"
          sudo ln -sfn "$PY_INC" "/usr/include/python${PY_VER}"
          sudo ln -sf "${PY_PREFIX}/lib/libpython${PY_VER}"* /usr/lib/ 2>/dev/null || true
          sudo ln -sf "${PY_PREFIX}/lib/libpython${PY_VER}"* /usr/lib/x86_64-linux-gnu/ 2>/dev/null || true
          sudo ldconfig
          test -f "/usr/include/python${PY_VER}/Python.h"
          "/usr/bin/python${PY_VER}-config" --includes --ldflags

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Briefcase Create & Build
        run: |
          briefcase create --no-input
          briefcase build --no-input

      - name: Prepare Windows WiX License
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -c "
          with open('LICENSE', 'r') as f: lines = f.readlines()
          rtf = ['{\\rtf1\\ansi\\deff0{\\fonttbl{\\f0 Arial;}}\\f0\\fs20\n'] + [l.rstrip().replace('\\', '\\\\') + '\\par\n' for l in lines] + ['}\n']
          with open('LICENSE.rtf', 'w') as f: f.writelines(rtf)
          "
          Get-ChildItem -Path "build" -Recurse -Directory -Filter "app" | ForEach-Object {
            Copy-Item "LICENSE.rtf" -Destination $_.FullName -Force
          }

      - name: Briefcase Package (Installer Generation)
        run: |
          briefcase package --no-input --adhoc-sign

      - name: Upload Distribution Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repolaris-distribution-${{ runner.os }}
          path: |
            dist/*
          if-no-files-found: warn
          retention-days: 30
