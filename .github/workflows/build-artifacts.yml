name: Build & Package Artifacts (CI/CD)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & Signal Engine Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          python -m unittest discover tests

  nuitka-prototype:
    name: Nuitka Prototype Build (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Linux System Libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libdbus-1-3 patchelf ccache

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,packaging]"

      - name: Build Standalone Prototype with Nuitka
        run: |
          python scripts/build_nuitka.py --standalone

      - name: Upload Nuitka Prototype Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repolaris-prototype-${{ runner.os }}
          path: dist/nuitka/
          retention-days: 14

  briefcase-release:
    name: Briefcase Distribution Release (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: "pyproject.toml"

      - name: Install Linux Build Tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libgtk-3-dev appstream

      - name: Install Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase

      - name: Briefcase Create & Build
        run: |
          briefcase create --no-input
          briefcase build --no-input

      - name: Briefcase Package (Installer Generation)
        run: |
          briefcase package --no-input --adhoc-sign

      - name: Upload Distribution Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repolaris-distribution-${{ runner.os }}
          path: dist/*
          if-no-files-found: warn
          retention-days: 30
