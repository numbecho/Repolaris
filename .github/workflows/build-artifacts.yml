name: Repolaris CI & Briefcase Packaging

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit & Clinical Test Suite (Python 3.14)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: src
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install system Qt/OpenGL headless libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libxkbcommon-x11-0 libegl1 libdbus-1-3

      - name: Install Repolaris and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"

      - name: Run 65-case automated unit test suite
        run: |
          PYTHONPATH=src QT_QPA_PLATFORM=offscreen python -m unittest discover tests -v

  briefcase-release:
    name: Briefcase Installer (${{ matrix.os }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform_name: linux
            package_args: "linux system"
          - os: windows-latest
            platform_name: windows
            package_args: "windows"
          - os: macos-latest
            platform_name: macos
            package_args: "macOS --adhoc-sign"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            patchelf \
            ccache \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            appstream \
            dpkg-dev \
            fakeroot

      - name: Install BeeWare Briefcase
        run: |
          python -m pip install --upgrade pip
          pip install briefcase zstandard

      - name: Create, Build, and Package Briefcase Installer
        run: |
          briefcase create ${{ matrix.package_args }} --no-input
          briefcase build ${{ matrix.package_args }} --no-input
          briefcase package ${{ matrix.package_args }} --no-input

      - name: Upload Distribution Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repolaris-distribution-${{ matrix.platform_name }}
          path: dist/*
          retention-days: 30
          if-no-files-found: warn
